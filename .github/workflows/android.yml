name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Buat proyek Capacitor
        run: |
          mkdir -p android-build
          cd android-build
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 \
                @anuradev/capacitor-background-mode \
                @jofr/capacitor-media-session \
                --legacy-peer-deps
          mkdir -p www
          echo '<!doctype html><title>Cropify</title>' > www/index.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.kaltzy.cropify",
            "appName": "Cropify",
            "webDir": "www",
            "server": {
              "url": "https://cropifymusic.vercel.app",
              "androidScheme": "https",
              "cleartext": false
            }
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: Inject permission ke AndroidManifest
        run: |
          python3 - <<'PY'
          import re
          p = 'android-build/android/app/src/main/AndroidManifest.xml'
          s = open(p).read()

          perms = (
              '    <uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n'
              '    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n'
          )

          if 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' not in s:
              s = re.sub(r'(\n\s*<application\b)', '\n' + perms + r'\1', s, count=1)
              open(p, 'w').write(s)
              print("Permissions injected.")
          else:
              print("Permissions already present, skipping.")
          PY

      - name: Ikon aplikasi (opsional)
        continue-on-error: true
        run: |
          rm -rf android-build/android/app/src/main/res/mipmap-anydpi-v26
          python3 -m pip install --break-system-packages pillow
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          if not os.path.exists('public/logo.png'):
              raise SystemExit('logo.png tidak ada, skip ikon')
          im = Image.open('public/logo.png').convert('RGBA').resize((192, 192))
          for d in glob.glob('android-build/android/app/src/main/res/mipmap-*'):
              for n in ('ic_launcher.png', 'ic_launcher_round.png'):
                  im.save(os.path.join(d, n))
          PY

      - name: Patch BgWebView (WebView tidak pernah dianggap tersembunyi)
        continue-on-error: true
        run: |
          set -e
          APP=android-build/android
          NM=android-build/node_modules/@capacitor/android
          LIB=$NM/capacitor/src/main/java/com/getcapacitor
          D=$APP/app/src/main/java/com/kaltzy/cropify

          LAYOUT=$(find "$NM" -name bridge_layout_main.xml | head -1)
          echo "Layout bawaan: $LAYOUT"
          cat "$LAYOUT"
          grep -q "bridge_layout_main" "$LIB/BridgeActivity.java" || { echo "::warning::BridgeActivity tidak memakai bridge_layout_main"; exit 1; }

          if [ -f "$LIB/CapacitorWebView.java" ]; then BASE=com.getcapacitor.CapacitorWebView; else BASE=android.webkit.WebView; fi
          echo "Kelas dasar: $BASE"

          cat > "$D/BgWebView.java" <<JAVA
          package com.kaltzy.cropify;

          import android.content.Context;
          import android.util.AttributeSet;
          import android.view.View;

          public class BgWebView extends $BASE {
            public BgWebView(Context context, AttributeSet attrs) {
              super(context, attrs);
            }

            @Override
            protected void onWindowVisibilityChanged(int visibility) {
              // Jangan pernah laporkan "tersembunyi" supaya YouTube tidak pause
              super.onWindowVisibilityChanged(View.VISIBLE);
            }
          }
          JAVA

          mkdir -p "$APP/app/src/main/res/layout"
          sed -E 's#</(com\.getcapacitor\.CapacitorWebView|WebView)>#</com.kaltzy.cropify.BgWebView>#; s#<(com\.getcapacitor\.CapacitorWebView|WebView)#<com.kaltzy.cropify.BgWebView#' "$LAYOUT" > "$APP/app/src/main/res/layout/bridge_layout_main.xml"
          grep -q "com.kaltzy.cropify.BgWebView" "$APP/app/src/main/res/layout/bridge_layout_main.xml" || { echo "::error::gagal mengganti tag WebView"; exit 1; }
          cat "$APP/app/src/main/res/layout/bridge_layout_main.xml"

      - name: Patch MainActivity (jaga WebView tetap aktif di background)
        run: |
          D=android-build/android/app/src/main/java/com/kaltzy/cropify
          ls "$D"
          cat > "$D/MainActivity.java" <<'JAVA'
          package com.kaltzy.cropify;

          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            private final Handler handler = new Handler(Looper.getMainLooper());
            private boolean inBackground = false;

            private final Runnable keepAlive = new Runnable() {
              @Override
              public void run() {
                if (!inBackground) return;
                if (getBridge() != null && getBridge().getWebView() != null) {
                  WebView w = getBridge().getWebView();
                  w.onResume();
                  w.resumeTimers();
                  w.dispatchWindowVisibilityChanged(View.VISIBLE);
                }
                handler.postDelayed(this, 700);
              }
            };

            private void startKeepAlive() {
              inBackground = true;
              handler.removeCallbacks(keepAlive);
              handler.post(keepAlive);
            }

            @Override
            public void onPause() {
              super.onPause();
              startKeepAlive();
            }

            @Override
            public void onStop() {
              super.onStop();
              startKeepAlive();
            }

            @Override
            public void onResume() {
              super.onResume();
              inBackground = false;
              handler.removeCallbacks(keepAlive);
            }

            @Override
            public void onDestroy() {
              inBackground = false;
              handler.removeCallbacksAndMessages(null);
              super.onDestroy();
            }
          }
          JAVA

      - name: Build APK
        run: |
          cd android-build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Cropify-APK
          path: android-build/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
